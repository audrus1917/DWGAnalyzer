[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parsedwg"
version = "0.1.0"
description = "MVP сервис для извлечения данных из DWG/DXF и формирования СО, ВОР и сметы"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<6.0",
    "ezdxf>=1.3,<2.0",
    "python-docx>=1.1,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "nltk>=3.9,<4.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "alembic>=1.13,<2.0",
]

[project.scripts]
parsedwg = "parsedwg.cli:main"
dwg = "parsedwg.cli:main"
parsedwg-name-lemmas = "parsedwg.name_lemmas:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
